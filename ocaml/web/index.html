<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>OCaml 計算モデル</title>
<style>body { font-family: system-ui; max-width: 65rem; margin: 2rem auto; padding: 0 1rem; }</style>
<h1>OCaml 計算モデル</h1>
<p>既存の assets/script.js と Renderer を使います。<a href="?backend=wasm">Wasm</a> / <a href="?backend=js">JS</a></p>
<h2>Example counter</h2>
<div id="counter"></div>
<h2>Lambda calculus</h2>
<div id="lambda"></div>
<script type="module">
import {mountModel} from '../../assets/script.js';
const suffix = new URLSearchParams(location.search).get('backend') === 'js' ? '_js' : '';
const options = {bundleBaseUrl: '/ocaml_bundle/', assetBaseUrl: '/assets/'};
for (const [id, model, code, rinput] of [
  ['counter', 'ocaml_example_counter', '3', 'inc'],
  ['lambda', 'ocaml_lambda_calculus', '(\\x. x) (\\y. y)', '0'],
]) {
  const root = document.getElementById(id);
  mountModel(root, {...options, model: model + suffix, code, rinput})
    .catch(error => { root.textContent = String(error); });
}
</script>
</html>
