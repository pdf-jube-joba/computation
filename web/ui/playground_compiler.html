<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compiler Playground</title>
  <link rel="stylesheet" href="./playground.css">
</head>
<body data-kind="compiler">
  <main class="pg-shell">
    <section class="pg-hero">
      <p class="pg-kicker">Compiler Playground</p>
      <h1>生成済み compiler を切り替えて試す</h1>
      <p class="pg-lead">
        ビルド済みのコンパイラを選んで変換を試せます。
        <a href="./playground_model.html">Model Playground</a>
      </p>
    </section>

    <section class="pg-toolbar">
      <label class="pg-control">
        <span>Compiler</span>
        <select id="model-select"></select>
      </label>
      <button id="reload-button" type="button">Reload</button>
      <div id="status-text" class="pg-status" aria-live="polite"></div>
    </section>

    <section class="pg-layout">
      <aside class="pg-sidebar">
        <div class="pg-card">
          <h2>Current Bundle</h2>
          <dl class="pg-meta">
            <div>
              <dt>Selected</dt>
              <dd id="selected-model">-</dd>
            </div>
            <div>
              <dt>Count</dt>
              <dd id="model-count">-</dd>
            </div>
          </dl>
        </div>

        <div class="pg-card">
          <h2>Artifacts</h2>
          <ul class="pg-links">
            <li><a id="runtime-link" href="#" target="_blank" rel="noreferrer">Shared runtime</a></li>
            <li><a id="loader-link" href="#" target="_blank" rel="noreferrer">Runtime loader</a></li>
            <li><a id="wasm-link" href="#" target="_blank" rel="noreferrer">Wasm assets</a></li>
          </ul>
        </div>
      </aside>

      <section class="pg-stage">
        <div id="playground-root" class="pg-model-host"></div>
      </section>
    </section>
  </main>

  <script type="module" src="./playground.js"></script>
</body>
</html>
