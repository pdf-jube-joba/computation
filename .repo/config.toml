name = "computation"

[serve]
port = 3001
plugin_url_prefix = "/.plugin"
policy_url_prefix = "/.policy"
info_url_prefix = "/.info"

[[plugin]]
name = "md-preview"
runner = "default"
allow = ["me"]
mount = "/md/"

[plugin.md_preview]
macro_path = "./macros.txt"

[ignore]
paths = [
  ".git",
  ".gitignore",
  ".codex",
  ".agents",
  "_wfs",
  "_build",
  "tools",
  "generated",
  "wasm_bundle",
  ".gitmodules",
]

[[policy]]
path = "/"
GET = ["me"]

[[policy]]
path = "docs/"
GET = ["me"]
POST = ["me"]
PUT = ["me"]
DELETE = ["me"]

[[policy]]
path = "models/"
GET = ["me"]
POST = []
PUT = ["me"]
DELETE = []

[[policy]]
path = "utils/"
GET = ["me"]

[[policy]]
path = "README.md"
GET = ["me"]
POST = []
PUT = ["me"]
DELETE = []

[[policy]]
path = "test.md"
GET = ["me"]
POST = []
PUT = ["me"]
DELETE = []
