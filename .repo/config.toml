name = "computation"

[serve]
port = 3001
plugin_url_prefix = "/.plugin"
policy_url_prefix = "/.policy"
info_url_prefix = "/.info"

[[plugin]]
name = "build-wasm"
runner = "command"
command = ["node", "./tools/build_models.mjs", "--clean"]
allow = ["me"]
mount = "/wasm_bundle/"
source = "wasm_bundle/"

# Serve UI sources directly. The command runner requires a command even for
# a static mount; there is nothing to generate for this plugin.
[[plugin]]
name = "web-ui"
runner = "command"
command = ["true"]
allow = ["me"]
mount = "/assets/"
source = "web/ui/"

[[plugin]]
name = "md-preview"
runner = "default"
allow = ["me"]
mount = "/md/"

[plugin.md_preview]
macro_path = "./macros.txt"

[plugin.md_preview.md_viewer]
additional_js = ["assets/header.js"]

[ignore]
paths = [
  ".git",
  ".gitignore",
  ".codex",
  ".agents",
  "_wfs",
  "_build",
  "tools",
  "dune",
  "dune-project",
  "ocamlformat",
  "computation.install",
  "computation.opam",
]

[[policy]]
path = "/"
GET = ["me"]

[[policy]]
path = "docs/"
GET = ["me"]
POST = ["me"]
PUT = ["me"]
DELETE = ["me"]

[[policy]]
path = "assets/"
GET = ["me"]

[[policy]]
path = "models/"
GET = ["me"]
POST = []
PUT = ["me"]
DELETE = []

[[policy]]
path = "viewer/"
GET = ["me"]

[[policy]]
path = "utils/"
GET = ["me"]

[[policy]]
path = "cli/"
GET = ["me"]

[[policy]]
path = "README.md"
GET = ["me"]
POST = []
PUT = ["me"]
DELETE = []

[[policy]]
path = "test.md"
GET = ["me"]
POST = []
PUT = ["me"]
DELETE = []
